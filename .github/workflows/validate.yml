name: Validate
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
jobs:
  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install --upgrade pip
      - run: python -m pip install homeassistant pytest ruff
      - run: python -m compileall -q custom_components
      - run: pytest -q
      - run: ruff check custom_components tests
